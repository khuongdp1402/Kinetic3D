
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetic3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetic3d_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kinetic3d_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kinetic3d_network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - kinetic3d_network

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/kinetic3d-assets;
      /usr/bin/mc anonymous set public myminio/kinetic3d-assets;
      exit 0;
      "
    networks:
      - kinetic3d_network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kinetic3d_master_key_12345}
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - kinetic3d_network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kinetic3d:kinetic3d_pass@postgres:5432/umami}
    ports:
      - "8080:3000"
    networks:
      - kinetic3d_network

  backend:
    build:
      context: .
      dockerfile: src/Kinetic3D.WebAPI/Dockerfile
    container_name: kinetic3d-backend
    restart: on-failure
    depends_on:
      - postgres
      - minio
      - meilisearch
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-kinetic3d_db};Username=${POSTGRES_USER:-kinetic3d};Password=${POSTGRES_PASSWORD:-kinetic3d_pass}
      - MinioSettings__Endpoint=minio:9000
      - MinioSettings__PublicEndpoint=localhost:9000
      - MeilisearchSettings__Endpoint=http://meilisearch:7700
      - ASPNETCORE_ENVIRONMENT=Development
      - GoogleSettings__ClientId=769330965816-b43m8bgmaji0pegp7r58uqbd0up1mls5.apps.googleusercontent.com
      - GoogleSettings__ClientSecret=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
      - TripoSettings__ApiKey=tsk_lEA-ZKk5yNHUcnpj7kvTGvfUM-GNxHF-OKXm5PqFIYA
      - "CassoSettings__WebhookSecret=ZZg;NLZ3daPf2&iN"
    ports:
      - "5099:8080"
    networks:
      - kinetic3d_network

  frontend:
    build:
      context: src/Kinetic3D.WebUI_V2
      dockerfile: Dockerfile
    container_name: kinetic3d-frontend
    restart: on-failure
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5099
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=769330965816-b43m8bgmaji0pegp7r58uqbd0up1mls5.apps.googleusercontent.com
      - TRIPO_API_KEY=tsk_lEA-ZKk5yNHUcnpj7kvTGvfUM-GNxHF-OKXm5PqFIYA
    ports:
      - "3003:3000"
    networks:
      - kinetic3d_network

volumes:
  postgres_data:
  minio_data:
  meili_data:

networks:
  kinetic3d_network:
    driver: bridge
