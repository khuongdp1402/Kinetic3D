version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetic3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetic3d_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kinetic3d_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kinetic3d_network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - kinetic3d_network

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/products;
      /usr/bin/mc anonymous set public myminio/products;
      exit 0;
      "
    networks:
      - kinetic3d_network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kinetic3d_master_key_12345}
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - kinetic3d_network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kinetic3d:kinetic3d_pass@postgres:5432/umami}
    ports:
      - "3000:3000"
    networks:
      - kinetic3d_network

volumes:
  postgres_data:
  minio_data:
  meili_data:

networks:
  kinetic3d_network:
    driver: bridge
