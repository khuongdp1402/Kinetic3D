<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Face Gradient: Futuristic Emerald to Lime -->
    <linearGradient id="k3d-top" x1="24" y1="4" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Left Face Gradient: Deep Tech Teal/Cyan -->
    <linearGradient id="k3d-left" x1="6" y1="14" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right Face Gradient: Cyber Obsidian Metallic -->
    <linearGradient id="k3d-right" x1="24" y1="24" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="k3d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Facets -->
  <polygon points="24,5 41,15 24,24 7,15" fill="url(#k3d-top)" opacity="0.95" />
  <polygon points="7,15 24,24 24,43 7,33" fill="url(#k3d-left)" opacity="0.85" />
  <polygon points="24,24 41,15 41,33 24,43" fill="url(#k3d-right)" opacity="0.9" />

  <!-- Cyber Inner Struts -->
  <line x1="24" y1="5" x2="24" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="7" y1="15" x2="24" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="41" y1="15" x2="24" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="24" y1="24" x2="24" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Sharp Neon Green Outline -->
  <polygon points="24,5 41,15 41,33 24,43 7,33 7,15" stroke="#22c55e" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Vertices Neon Points -->
  <circle cx="24" cy="5" r="2.2" fill="#ffffff" filter="url(#k3d-glow)" />
  <circle cx="41" cy="15" r="1.8" fill="#4ade80" />
  <circle cx="7" cy="15" r="1.8" fill="#38bdf8" />
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="url(#k3d-glow)" />
  <circle cx="24" cy="43" r="1.8" fill="#22c55e" />
</svg>
